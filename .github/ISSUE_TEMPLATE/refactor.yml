
name: "♻️ 코드 리팩토링"
description: "기존 기능을 유지하면서 코드 구조를 개선합니다."
title: "[Refactor] "
labels: ["refactor"]

body:
  - type: markdown
    attributes:
      value: |
        ## ♻️ Refactoring
        기능 변경 없이 코드의 유지보수성을 개선합니다.

  - type: dropdown
    id: service
    attributes:
      label: "📦 담당 서비스"
      options:
        - "User Service"
        - "Product Service"
        - "Trade Service"
        - "Payment Service"
        - "Gateway"
        - "Eureka Server"
        - "Frontend (Next.js)"
        - "Infrastructure"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: "📂 리팩토링 대상"
      description: "개선할 코드나 모듈을 작성해 주세요."
      placeholder: "예) UserService 회원가입 처리 로직"
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: "💡 개선이 필요한 이유"
      placeholder: |
        예)
        - 메서드 책임이 과도하게 집중됨
        - 중복 코드가 존재함
        - 테스트 작성이 어려움
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: "🛠️ 개선 방향"
      description: "어떤 구조로 변경할 예정인가요?"
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "✅ 상세 작업"
      value: |
        - [ ] 기존 코드 분석
        - [ ] 코드 구조 개선
        - [ ] 기존 테스트 통과 확인
        - [ ] 기능 변경 여부 확인
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: "📎 참고 사항"
    validations:
      required: false
